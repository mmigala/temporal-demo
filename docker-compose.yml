name: temporal-showcase

services:
  postgresql:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: temporal
      POSTGRES_PASSWORD: temporal-local-dev-only
      POSTGRES_DB: temporal
    volumes:
      - postgresql-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U temporal"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - temporal-showcase

  temporal:
    image: temporalio/auto-setup:1.29.7
    depends_on:
      postgresql:
        condition: service_healthy
    environment:
      DB: postgres12
      DB_PORT: 5432
      POSTGRES_USER: temporal
      POSTGRES_PWD: temporal-local-dev-only
      POSTGRES_SEEDS: postgresql
    ports:
      - "7233:7233"
    healthcheck:
      # The auto-setup image binds the frontend service to the container's own network IP, not
      # 127.0.0.1, so the health check must target it by its Compose service name instead.
      test: ["CMD-SHELL", "nc -z temporal 7233 || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 30
    networks:
      - temporal-showcase

  temporal-ui:
    image: temporalio/ui:2.53.3
    depends_on:
      temporal:
        condition: service_healthy
    environment:
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_CORS_ORIGINS: http://localhost:8088
    ports:
      # Host 8088 -> container 8080, so it does not collide with the API's own 8080 mapping.
      - "8088:8080"
    networks:
      - temporal-showcase

  rabbitmq:
    image: rabbitmq:4.2.9-management-alpine
    environment:
      # Demo-only credentials; never reuse for a real deployment.
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest-local-dev-only
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - temporal-showcase

  capacity-service:
    build:
      context: .
      dockerfile: src/TemporalShowcase.CapacityService/Dockerfile
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - temporal-showcase

  document-processor:
    build:
      context: .
      dockerfile: src/TemporalShowcase.DocumentProcessor/Dockerfile
    depends_on:
      rabbitmq:
        condition: service_healthy
      temporal:
        condition: service_healthy
    environment:
      RabbitMq__HostName: rabbitmq
      RabbitMq__Port: "5672"
      RabbitMq__UserName: guest
      RabbitMq__Password: guest-local-dev-only
      Temporal__Host: temporal:7233
      Temporal__Namespace: default
      Processing__ProcessingDelay: "00:00:02"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - temporal-showcase

  worker:
    build:
      context: .
      dockerfile: src/TemporalShowcase.Worker/Dockerfile
    depends_on:
      rabbitmq:
        condition: service_healthy
      temporal:
        condition: service_healthy
      capacity-service:
        condition: service_healthy
      document-processor:
        condition: service_healthy
    environment:
      RabbitMq__HostName: rabbitmq
      RabbitMq__Port: "5672"
      RabbitMq__UserName: guest
      RabbitMq__Password: guest-local-dev-only
      Temporal__Host: temporal:7233
      Temporal__Namespace: default
      Services__CapacityServiceBaseUrl: http://capacity-service:8080
      Services__DocumentProcessorBaseUrl: http://document-processor:8080
    networks:
      - temporal-showcase

  api:
    build:
      context: .
      dockerfile: src/TemporalShowcase.Api/Dockerfile
    depends_on:
      temporal:
        condition: service_healthy
    environment:
      Temporal__Host: temporal:7233
      Temporal__Namespace: default
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - temporal-showcase

networks:
  temporal-showcase:
    driver: bridge

volumes:
  postgresql-data:
